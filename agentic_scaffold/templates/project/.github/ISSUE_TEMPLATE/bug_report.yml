name: Bug report
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交密钥、客户数据或安全漏洞细节。安全问题请按 SECURITY.md 私下报告。
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本、AI 工具等
    validations:
      required: true
